{% extends 'base.html' %}

{% block title %}Create Listing - Varsity Connect{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 24px auto 40px; background: rgba(255,255,255,0.9); padding: clamp(22px, 4vw, 36px); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-card);">
    <a href="{% url 'marketplace' %}" style="display: inline-block; margin-bottom: 20px; color: var(--teal); font-size: 13px; font-weight: 700; text-decoration: none;">&larr; Back to marketplace</a>
    <span style="display: block; color: var(--gold-deep); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">Pass it on</span>
    <h1 style="font-family: 'Fraunces', serif; font-size: clamp(28px, 4vw, 36px); color: var(--navy); margin: 7px 0;">List an item</h1>
    <p style="color: var(--ink-soft); font-size: 14px; margin: 0 0 24px;">Add a few details so other students know what’s available.</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit" style="background: var(--gold); color: var(--navy); border: none; padding: 12px 20px; font-weight: 600; font-size: 14px; border-radius: var(--radius); cursor: pointer; width: 100%; margin-top: 16px;">
            Publish listing
        </button>
    </form>
</div>
{% endblock %}
