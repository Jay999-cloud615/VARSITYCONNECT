{% extends 'base.html' %}

{% block title %}Create Listing - Varsity Connect{% endblock %}

{% block content %}
<div class="create-listing-card">
    <a href="{% url 'marketplace' %}" class="create-listing-back">&larr; Back to marketplace</a>
    <h1 class="create-listing-title">List an item</h1>
    <p class="create-listing-intro">Add details so other students can find your listing.</p>

    <form method="POST" enctype="multipart/form-data" class="create-listing-form">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit" class="create-listing-submit">
            Publish listing
        </button>
    </form>
</div>

<style>
    .create-listing-card {
        width: 100%;
        max-width: 820px;
        margin: 20px auto 48px;
        background: var(--white);
        padding: clamp(28px, 4vw, 44px);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow-card);
    }
    .create-listing-back {
        display: inline-block;
        margin-bottom: 18px;
        color: var(--c-cobalt);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: color 0.15s ease;
    }
    .create-listing-back:hover {
        color: var(--gold-deep);
        text-decoration: underline;
    }
    .create-listing-title {
        font-size: clamp(28px, 3.5vw, 36px);
        font-weight: 800;
        color: var(--c-midnight);
        margin: 0 0 8px;
        letter-spacing: -0.4px;
    }
    .create-listing-intro {
        color: var(--c-slate);
        font-size: 15px;
        margin: 0 0 28px;
        line-height: 1.5;
    }
    .create-listing-submit {
        background: var(--c-cobalt);
        color: var(--white);
        border: none;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 15px;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
        margin-top: 20px;
        box-shadow: 0 6px 20px rgba(0, 75, 168, 0.25);
        transition: all 0.15s ease;
    }
    .create-listing-submit:hover {
        background: var(--gold-deep);
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(0, 75, 168, 0.35);
    }
</style>
{% endblock %}
