{% extends 'base.html' %}

{% block content %}
<div style="max-width: 900px; margin: 20px auto 40px; padding: 28px; background: rgba(255,255,255,0.82); border-radius: 28px; box-shadow: var(--shadow-card); border: 1px solid rgba(21,39,63,0.06);">
    <h2 style="color: var(--navy); margin-top: 0; font-family: 'Fraunces', serif; font-size: 32px;">Chat with {{ other_user.username }}</h2>

    <div style="height: 420px; overflow-y: auto; border: 1px solid rgba(21,39,63,0.08); padding: 16px; border-radius: 20px; background: rgba(245,246,248,0.9); margin-bottom: 18px; display: flex; flex-direction: column; gap: 12px;">
        {% for message in messages %}
            <div style="max-width: 72%; padding: 12px 14px; border-radius: 16px; {% if message.sender == request.user %} background: linear-gradient(135deg, var(--navy), var(--navy-soft)); color: white; align-self: flex-end; {% else %} background: white; color: var(--ink); align-self: flex-start; box-shadow: 0 6px 16px rgba(21,39,63,0.04); {% endif %}">
                <p style="margin: 0; font-size: 14px; line-height: 1.5;">{{ message.body }}</p>
                <span style="font-size: 10px; opacity: 0.75; display: block; margin-top: 6px; text-align: right;">{{ message.timestamp|time:"H:i" }}</span>
            </div>
        {% empty %}
            <p style="text-align: center; color: var(--ink-soft); margin-top: 150px;">No messages yet. Send a message to start the conversation!</p>
        {% endfor %}
    </div>

    <form method="POST" style="display: flex; gap: 10px;">
        {% csrf_token %}
        <input type="text" name="body" placeholder="Type your message here..." required style="flex-grow: 1; padding: 14px 16px; border: 1px solid rgba(21,39,63,0.1); border-radius: 14px; outline: none; background: white; font-size: 14px;">
        <button type="submit" style="background: linear-gradient(135deg, var(--gold), #f7d98d); color: var(--navy); border: none; padding: 0 22px; font-weight: 800; border-radius: 14px; cursor: pointer;">Send</button>
    </form>
</div>
{% endblock %}
