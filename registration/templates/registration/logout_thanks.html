<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="4;url={% url 'login' %}">
    <title>Thanks for visiting | Varsity Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--ink:#342e2d;--muted:#706969;--navy:#342e2d;--teal:#7b8887;--gold:#9eafa9;--paper:#f5f7f5;--line:#d4ded8;--lime:#cbd8d0;}
        *{box-sizing:border-box;}
        body, body *{font-family:'Plus Jakarta Sans', sans-serif !important;}
        body{
            min-height:100vh;
            margin:0;
            display:grid;
            place-items:center;
            padding:24px;
            background-color:var(--paper);
            background-image:
                linear-gradient(to right, rgba(52,46,45,0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(52,46,45,0.035) 1px, transparent 1px);
            background-size:28px 28px;
            color:var(--ink);
            font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        main{
            width:min(100%,500px);
            padding:clamp(28px,6vw,44px);
            background:#ffffff;
            border:1px solid rgba(52,46,45,.14);
            border-radius:8px;
            box-shadow:0 4px 16px rgba(52,46,45,.06);
            text-align:center;
        }
        .brand{display:inline-flex;align-items:center;gap:10px;color:var(--navy);font:600 11px 'IBM Plex Mono',monospace;letter-spacing:1.2px;text-decoration:none;}
        .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;background:var(--gold);font:700 18px 'Fraunces',serif;color:var(--navy);}
        .eyebrow{margin:28px 0 10px;color:var(--teal);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:1.4px;}
        h1{margin:0;color:var(--navy);font:600 clamp(28px,6vw,38px)/1.15 'Fraunces',serif;}
        .message{max-width:390px;margin:14px auto 0;color:var(--muted);font-size:14px;line-height:1.55;}
        .redirect{display:flex;align-items:center;justify-content:center;gap:9px;margin:24px 0 18px;color:var(--muted);font-size:12px;}
        .redirect-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
        .return-link{display:inline-block;padding:10px 18px;border-radius:6px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:background 0.15s ease;}
        .return-link:hover{background:var(--teal);}
    </style>
</head>
<body>
    <main>
        <a class="brand" href="{% url 'login' %}"><span class="brand-mark">V</span><span>VARSITY CONNECT</span></a>
        <p class="eyebrow">SESSION ENDED</p>
        <h1>Thanks for visiting.</h1>
        <p class="message">You have been logged out successfully. We hope to see you back on campus soon.</p>
        <p class="redirect"><span class="redirect-dot"></span>Taking you back to sign in shortly</p>
        <a class="return-link" href="{% url 'login' %}">Return to login now</a>
    </main>
</body>
</html>
