<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="4;url={% url 'login' %}">
    <title>Thanks for visiting | Varsity Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --ink:#07070a;
            --muted:#4a525a;
            --navy:#07070a;
            --charcoal:#24272b;
            --steel:#3e78b2;
            --cobalt:#004ba8;
            --cobalt-deep:#003a84;
            --paper:#f4f6f9;
            --line:#e1e6ed;
        }
        *{box-sizing:border-box;}
        body, body *{font-family:'Plus Jakarta Sans', sans-serif !important;}
        body{
            min-height:100vh;
            margin:0;
            display:grid;
            place-items:center;
            padding:24px;
            background-color:var(--paper);
            color:var(--ink);
        }
        main{
            width:min(100%,520px);
            padding:clamp(32px,6vw,48px);
            background:#ffffff;
            border:1px solid var(--line);
            border-radius:14px;
            box-shadow:0 12px 30px rgba(7,7,10,0.06);
            text-align:center;
        }
        .brand{display:inline-flex;align-items:center;gap:12px;color:var(--navy);font:800 13px 'Plus Jakarta Sans',sans-serif;letter-spacing:0.8px;text-decoration:none;}
        .brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg, var(--cobalt), var(--steel));font:800 20px 'Plus Jakarta Sans',sans-serif;color:#ffffff;box-shadow:0 4px 12px rgba(0,75,168,0.3);}
        .eyebrow{margin:28px 0 10px;color:var(--steel);font:700 11px 'Plus Jakarta Sans',sans-serif;letter-spacing:1.4px;text-transform:uppercase;}
        h1{margin:0;color:var(--navy);font:800 clamp(28px,6vw,36px)/1.15 'Plus Jakarta Sans',sans-serif;}
        .message{max-width:400px;margin:14px auto 0;color:var(--muted);font-size:15px;line-height:1.6;}
        .redirect{display:flex;align-items:center;justify-content:center;gap:9px;margin:24px 0 18px;color:var(--muted);font-size:13px;font-weight:600;}
        .redirect-dot{width:8px;height:8px;border-radius:50%;background:var(--steel);}
        .return-link{display:inline-block;padding:12px 24px;border-radius:8px;background:var(--cobalt);color:#fff;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,75,168,0.25);transition:all 0.15s ease;}
        .return-link:hover{background:var(--cobalt-deep);box-shadow:0 6px 18px rgba(0,75,168,0.35);}
    </style>
</head>
<body>
    <main>
        <a class="brand" href="{% url 'login' %}"><span class="brand-mark">V</span><span>VARSITY CONNECT</span></a>
        <p class="eyebrow">SESSION ENDED</p>
        <h1>Thanks for visiting.</h1>
        <p class="message">You have been logged out successfully. We hope to see you back on campus soon.</p>
        <p class="redirect"><span class="redirect-dot"></span>Taking you back to sign in shortly</p>
        <a class="return-link" href="{% url 'login' %}">Return to login now</a>
    </main>
</body>
</html>
